# Jednorázová diagnostika: co leží na FTP a co vrací doména. Spouští se ručně (workflow_dispatch), nic nenahrává ani nemaže.
# Vypisuje jen názvy souborů a složek a hlavičku deploy-manifest.json (commit a čas); hesla jsou v GitHub Secrets a v logu se maskují.
name: FTP Diag
on: workflow_dispatch
jobs:
  diag:
    name: Diagnostika FTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Výpis FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          vypis() {
            echo "=== /$1"
            curl -sS --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$1" 2>&1 | head -80
            if [ "${PIPESTATUS[0]}" != 0 ]; then
              echo "(ověřený TLS selhal, zkouším bez ověření certifikátu — jen výpis názvů)"
              curl -sS -k --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$1" 2>&1 | head -80
            fi
          }
          vypis ""
          vypis "hra/"
          vypis "logs/"
          vypis "uploads/"
          echo "=== deploy-manifest.json (hlavička)"
          curl -sS -k --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/deploy-manifest.json" 2>&1 | head -c 400
          echo
          echo "=== kořen o úroveň výš (kdyby bylo víc webů)"
          curl -sS -k --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/../" 2>&1 | head -40
      - name: Co vrací doména z GitHubu
        run: |
          set +e
          for u in https://vtt.zvelebil.online/ https://vtt.zvelebil.online/index.php https://vtt.zvelebil.online/robots.txt https://zvelebil.online/; do
            echo "=== $u"
            curl -sS -o /dev/null -D - --max-time 25 "$u" 2>&1 | head -12
          done
      - name: Ověření .htaccess
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          echo "=== .htaccess na FTP vs v repu (SHA-256)"
          for f in .htaccess logs/.htaccess uploads/.htaccess; do
            curl -sS -k --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$f" -o /tmp/vzdaleny.htaccess 2>&1
            echo "$f  FTP: $(sha256sum < /tmp/vzdaleny.htaccess | cut -c1-16)  repo: $(sha256sum < $f | cut -c1-16)  $(cmp -s /tmp/vzdaleny.htaccess $f && echo STEJNÝ || echo ODLIŠNÝ)"
          done
          echo "=== Uplatňuje web .htaccess z FTP? Naše hlavičky: X-Robots-Tag noindex, HSTS, CSP frame-ancestors; config.php a .htaccess mají být zavřené (403)"
          for u in / /index.php /config.php /.htaccess /includes/auth.php /logs/ /deploy-manifest.json; do
            h=$(curl -sS -o /dev/null -D - --max-time 25 "https://vtt.zvelebil.online$u" 2>&1)
            echo "$u -> $(echo "$h" | head -1 | tr -d '\r')  x-robots-tag:$(echo "$h" | grep -ci '^x-robots-tag')  hsts:$(echo "$h" | grep -ci '^strict-transport-security')  csp:$(echo "$h" | grep -ci '^content-security-policy')"
          done
          echo "=== HTTP/2 vs HTTP/1.1 a jiný Host"
          curl -sS -o /dev/null -D - --max-time 25 --http1.1 "https://vtt.zvelebil.online/robots.txt" 2>&1 | head -3
          echo "=== co říká robots.txt, který web vydává (69 B) a náš (26 B)"
          curl -sS --max-time 25 "https://vtt.zvelebil.online/robots.txt" 2>&1 | head -5
          echo "--- náš:"; cat robots.txt
      - name: Je složka FTP vidět na nějaké adrese? (značkový soubor)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          ZNACKA="dracak-znacka-$(date +%s).txt"
          echo "dracak-vtt $ZNACKA" > "$ZNACKA"
          echo "=== nahrání značky do kořene FTP"
          curl -sS -k --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" -T "$ZNACKA" "ftp://$FTP_SERVER/$ZNACKA" 2>&1 | tail -2
          sleep 2
          echo "=== kde se značka ukáže (200 = tady se servíruje kořen FTP)"
          for h in vtt.zvelebil.online zvelebil.online www.zvelebil.online; do
            for p in https http; do
              echo "$p://$h/$ZNACKA -> $(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$p://$h/$ZNACKA" 2>&1)"
            done
          done
          for c in vtt/ vtt.zvelebil.online/ domains/vtt.zvelebil.online/ www/; do
            echo "https://zvelebil.online/$c$ZNACKA -> $(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://zvelebil.online/$c$ZNACKA" 2>&1)"
          done
          echo "=== smazání značky z FTP"
          curl -sS -k --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -Q "-DELE $ZNACKA" 2>&1 | tail -2
          echo "=== po smazání v kořeni FTP:"
          curl -sS -k --max-time 40 --ssl-reqd -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" 2>&1 | grep -c "$ZNACKA"
