name: FTP Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to FTP hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate config.php
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          php -r '
          $config = [
              "db_host" => getenv("DB_HOST"),
              "db_name" => getenv("DB_NAME"),
              "db_user" => getenv("DB_USER"),
              "db_pass" => getenv("DB_PASS"),
              "migrate_token" => getenv("MIGRATE_TOKEN"),
          ];
          $php = "<?php\n"
              . "// Vygenerováno GitHub Actions při deployi z repozitářových secrets.\n"
              . "// Needituj ručně na serveru — příští deploy to přepíše. Necommituj do gitu.\n"
              . "return " . var_export($config, true) . ";\n";
          file_put_contents("config.php", $php);
          '

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/*.md
            node_modules/**
            database/drd-db-schema-v1.sql
            database/drd-db-full-v1.sql
            database/0002_ucty_a_role.sql
            database/RUCNE-*.sql
            docs/**
            setup-admin.php

      - name: Run pending DB migrations
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST "https://vtt.zvelebil.online/scripts/migrate.php" \
            -H "X-Migrate-Token: ${{ secrets.MIGRATE_TOKEN }}")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "::error::migrate.php vrátil HTTP $http_code"
            exit 1
          fi

      - name: Post-deploy smoke test
        run: |
          # Nezalogovaný request na tyhle stránky vždycky skončí na
          # dracak_require_login() dřív, než se stihne cokoli jiného —
          # takže 404/5xx tady může znamenat jen "soubor na serveru
          # fakticky chybí/spadl", ne "entita nenalezena" (to je jiná
          # větev kódu, co se sem vůbec nedostane). Řeší nespolehlivost
          # FTP přenosu na tomhle hostingu, co se v praxi ukázala: FTP
          # deploy krok výš hlásil úspěch, ale soubor na produkci
          # reálně chyběl.
          fail=0
          for path in dashboard.php editor.php pravidla.php hra/svety.php hra/svet.php hra/mapa.php hra/mapa_obrazek.php; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://vtt.zvelebil.online/$path")
            echo "$path -> HTTP $code"
            if [ "$code" = "404" ] || [ "$code" -ge 500 ]; then
              echo "::error::$path vrátil HTTP $code — soubor pravděpodobně chybí nebo spadl na serveru"
              fail=1
            fi
          done
          exit $fail
